[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclist-kb"
version = "0.1.0"
description = "Knowledge base scientifica sull'allenamento ciclistico auto-mantenuta da agenti (MVP locale)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6",
    "anthropic>=0.40",
    "python-dotenv>=1",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
research = "cyclist_kb.cli:app"

[tool.setuptools]
packages = ["cyclist_kb", "cyclist_kb.clients", "cyclist_kb.agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
