name: Enrich corpus (LLM via Claude Code)

# Arricchisce il corpus wiki rieseguendo la pipeline di ricerca con QUALITÀ LLM,
# usando Claude Code headless (claude -p) sull'abbonamento — nessun costo API.
# Consuma la quota Max: parti da 1 tema (input max_topics) per misurare, poi scala.

on:
  workflow_dispatch:
    inputs:
      max_topics:
        description: "Quanti temi arricchire (parti da 1 come pilota; max 18)"
        required: false
        default: "1"
  schedule:
    # Notturno ~05:00 CEST (03:00 UTC): arricchisce i prossimi temi NON ancora fatti
    # (registro enriched.txt), qualche tema a notte, quando non usi la chat.
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: enrich-corpus
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Installa il progetto
        run: pip install -e .

      - name: Arricchimento (backend Claude Code)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KB_LLM_BACKEND: claude_code
          KB_CONTACT_EMAIL: ${{ secrets.KB_CONTACT_EMAIL }}
          KB_GIT_AUTOCOMMIT: "0"
        run: |
          set -uo pipefail
          N="${{ github.event.inputs.max_topics }}"; N="${N:-4}"   # default 4/notte per lo schedule
          touch enriched.txt
          done=0
          while IFS= read -r topic || [ -n "$topic" ]; do
            [ -z "$topic" ] && continue
            if grep -Fxq "$topic" enriched.txt; then continue; fi   # già arricchito → salta
            echo "::group::Enrich: $topic"
            if python -m cyclist_kb.cli --quiet run "$topic"; then
              echo "$topic" >> enriched.txt                          # segna come fatto
              done=$((done+1))
            else
              echo "FALLITO (riprovabile al prossimo run): $topic"
            fi
            echo "::endgroup::"
            [ "$done" -ge "$N" ] && break
          done < research_topics.txt
          echo "Temi arricchiti in questo run: $done"

      - name: Verifica la wiki
        run: python scripts/lint_wiki.py

      - name: Commit della wiki arricchita
        run: |
          git config user.name "corpus-enrich-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wiki/ enriched.txt
          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "chore(corpus): arricchimento LLM (Claude Code) via Action"
            git pull --rebase origin main
            git push
          fi
