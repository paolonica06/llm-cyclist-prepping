name: Enrich corpus (LLM via Claude Code)

# Arricchisce il corpus wiki rieseguendo la pipeline di ricerca con QUALITÀ LLM,
# usando Claude Code headless (claude -p) sull'abbonamento — nessun costo API.
# Consuma la quota Max: parti da 1 tema (input max_topics) per misurare, poi scala.

on:
  workflow_dispatch:
    inputs:
      max_topics:
        description: "Quanti temi arricchire (parti da 1 come pilota; max 18)"
        required: false
        default: "1"
  # Notturno: decommenta SOLO quando sei sicuro della quota. 03:00 UTC.
  # schedule:
  #   - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: enrich-corpus
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Installa il progetto
        run: pip install -e .

      - name: Arricchimento (backend Claude Code)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KB_LLM_BACKEND: claude_code
          KB_CONTACT_EMAIL: ${{ secrets.KB_CONTACT_EMAIL }}
          KB_GIT_AUTOCOMMIT: "0"
        run: |
          set -euo pipefail
          N="${{ github.event.inputs.max_topics }}"
          N="${N:-1}"
          echo "Arricchisco i primi $N temi con qualità LLM…"
          head -n "$N" research_topics.txt | while IFS= read -r topic; do
            [ -z "$topic" ] && continue
            echo "::group::Enrich: $topic"
            python -m cyclist_kb.cli --quiet run "$topic" || echo "FALLITO: $topic"
            echo "::endgroup::"
          done

      - name: Commit della wiki arricchita
        run: |
          git config user.name "corpus-enrich-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wiki/
          if git diff --cached --quiet; then
            echo "Nessuna modifica alla wiki."
          else
            git commit -m "chore(corpus): arricchimento LLM (Claude Code) via Action"
            git push
          fi
